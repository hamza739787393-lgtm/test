<html>
<head>
<title>Network Scanner</title>
</head>
<body>
<script>
var results = [];

function scanPort(ip, port) {
    return new Promise(function(resolve) {
        var img = new Image();
        var timer = setTimeout(function() {
            img.src = '';
            resolve(false);
        }, 1500);
        img.onload = function() {
            clearTimeout(timer);
            resolve(true);
        };
        img.onerror = function() {
            clearTimeout(timer);
            resolve(false);
        };
        img.src = 'http://' + ip + ':' + port + '/favicon.ico';
    });
}

var pc = new RTCPeerConnection();
pc.createDataChannel('');
pc.createOffer().then(function(o) {
    return pc.setLocalDescription(o);
});
pc.onicecandidate = function(e) {
    if (e.candidate) {
        var ip = e.candidate.candidate.split(' ')[4];
        if (ip && ip.indexOf('.') > -1) {
            results.push('IP: ' + ip);
            document.write('IP Found: ' + ip + '<br>');
            
            var base = ip.substring(0, ip.lastIndexOf('.') + 1);
            var ports = [80, 443, 8080, 22, 23, 445, 139, 3389, 5900, 5555];
            
            ports.forEach(function(port) {
                scanPort(ip, port).then(function(open) {
                    document.write('Port ' + port + ': ' + (open ? 'OPEN' : 'closed') + '<br>');
                });
            });
        }
    }
};
</script>
</body>
</html>
