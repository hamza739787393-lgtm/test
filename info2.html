<title>Info</title>

<body>
<script>
try {
    var obj = window.android;
    document.write('Type: ' + typeof obj);
    document.write('<br>Value: ' + obj);
    document.write('<br>Keys: ' + Object.keys(obj));
} catch (e) {
    document.write('Error: ' + e);
}
</script>
