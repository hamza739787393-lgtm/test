<html>
<head>
<title>Test</title>
</head>
<body>
<script>
try {
    if (window.android) {
        document.write('OK Bridge');
    } else if (window.webkit) {
        document.write('WebKit Only');
    } else {
        document.write('No Bridge');
    }
} catch (e) {
    document.write('Error: ' + e);
}
</script>
</body>
</html>
